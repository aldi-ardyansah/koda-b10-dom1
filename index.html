<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="card-1">
            <h2 class="heading">Program Konversi Suhu</h2>
            <form>
                <div class="input">
                    <label for="suhuCelcius">Masukan suhu dalam Celcius (°C):</label>
                    <input id="inputCelcius" type="number" name="inputCelcius" autofocus>
                    <div class="buttons">
                        <button id="hitung" type="submit">Hitung</button>
                        <button id="hapus">Hapus</button>
                    </div>
                </div>
            </form>
            <div class="output">
                <div class="output-text">
                    <span>Suhu dalam Reamur:</span>
                    <span>Suhu dalam Fahrenheit:</span>
                    <span>Suhu dalam Kelvin:</span>
                </div>
                <div class="output-value">
                    <span id="reamur">-</span>
                    <span id="fahrenheit">-</span>
                    <span id="kelvin">-</span>
                </div>
                <div class="output-unit">
                    <span id="reamur">°R</span>
                    <span id="fahrenheit">°F</span>
                    <span id="kelvin">°K</span>
                </div>
            </div>
        </div>
        <div class="card-2">
            <div class="table">
                <h2>Tabel Histori Konversi</h2>
                <table id="history">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>&deg;C</th>
                            <th>&deg;R</th>
                            <th>&deg;F</th>
                            <th>&deg;K</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
